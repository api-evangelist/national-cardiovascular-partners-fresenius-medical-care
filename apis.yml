name: National Cardiovascular Partners (Fresenius Medical Care)
description: 'National Cardiovascular Partners (NCP) is a Fresenius Medical Care company
  that partners with physician entrepreneurs to create, sustain and grow independent,
  outpatient cardiac catheterization and vascular labs. Headquartered in Edina, Minnesota
  with operations in Houston, Texas, NCP manages the full development lifecycle of
  outpatient hybrid cardiovascular facilities in which physicians serve as majority
  stakeholders. It is a physical healthcare services operator: it publishes no public
  developer API, developer portal, SDKs, or webhooks, and its official domain (ncplp.com)
  is a registrar-parked defensive domain rather than an active site. Parent company
  Fresenius Medical Care likewise offers no public developer API. Surfaced as a portfolio
  company of Bain Capital Ventures and added to the API Evangelist network.'
